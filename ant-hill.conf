# ============================================================
#  ant-hill.conf - Heinzelmännchen-Brücke Konfiguration
# ============================================================
# Die Brücke spricht mit beliebigen OpenAI-kompatiblen Endpunkten
# (Ollama, llm-bahnhof, OpenAI, ...). Mehrere Endpunkte = Fallback:
# ENDPOINT_01 wird zuerst probiert, bei Fehlern ENDPOINT_02 usw.
#
# Format einer Endpunkt-Zeile (llm-bahnhof-Stil):
#   ENDPOINT_XX=URL|API-KEY|MODELL|TIMEOUT
#     URL     - Basis-URL des Endpunkts (z. B. http://host:11434 oder
#               http://host:8000/v1). /chat/completions wird automatisch ergänzt.
#     API-KEY - Optional. Leer lassen = kein Authorization-Header
#               (lokal, z. B. Ollama). Für Cloud-APIs hier den Key eintragen.
#     MODELL  - Modellname, der an den Endpunkt gesendet wird.
#     TIMEOUT - Sekunden (optional, Default 400).
# ============================================================

# --- Endpunkt 1: Lokales Ollama (Mac Mini 10.7.0.93) ---
ENDPOINT_01=http://10.7.0.93:11434||granite4.1:8b|400

# --- Endpunkt 2 (Beispiel): LLM-Bahnhof als Fallback/Alternative ---
# Der LLM-Bahnhof ist selbst OpenAI-kompatibel und kann weitere Provider
# (OpenAI, Hetzner, Groq, ...) oder andere Ollama-Knoten bündeln.
# Dazu hier den Host/Port des LLM-Bahnhofs eintragen (Default-Port 8000):
# ENDPOINT_02=http://10.7.0.93:8000/v1||llm-bahnhof|120

# --- Weitere Beispiele ---
# Direkter Cloud-Anbieter (OpenAI-kompatibel):
# ENDPOINT_03=https://api.openai.com/v1|sk-dein-key|gpt-4o-mini|60

# --- Allgemeine Einstellungen ---
# Modellname, den Claude Code im Antwort-Header sieht (Katalogname).
# Claude Code v2.x kennt nur seinen internen Katalog - unbekannte Namen
# erzeugen Warnungen. Der Proxy antwortet daher mit diesem Namen,
# nutzt intern aber das Modell des jeweiligen Endpunkts.
SPOOFED_MODEL=claude-sonnet-4-5

# Port, auf dem die Brücke lauscht (Claude Code -> http://127.0.0.1:PORT/v1)
PROXY_PORT=11435
